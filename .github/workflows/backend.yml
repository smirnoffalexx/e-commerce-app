name: backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "example_data.csv"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "example_data.csv"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: backend/bin
          key: tools-${{ runner.os }}-${{ hashFiles('backend/Makefile') }}

      - name: Generate swagger
        run: make swagger

      - name: Lint
        run: make lint

      - name: Build
        run: go build ./...

  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: backend/bin
          key: tools-${{ runner.os }}-${{ hashFiles('backend/Makefile') }}

      - name: Generate swagger
        run: make swagger

      - name: Test
        run: make test

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: backend/bin
          key: tools-${{ runner.os }}-${{ hashFiles('backend/Makefile') }}

      - name: Generate swagger
        run: make swagger

      - name: Test with PostgreSQL in testcontainers
        run: make test-integration
